name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Code-Import pruefen
        run: |
          python -c "import sys; sys.path.insert(0, 'src'); import anonymize; import tracking; print('Alle Module erfolgreich importiert')"

      - name: Docker-Image bauen
        run: docker build -t privacyshield-api-ci .